name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to commits, which, unlike tags, can't be moved to
# other code. Dependabot updates the pins and their version comments.
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          # The newest patch release, as the release workflow builds with.
          check-latest: true
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          # govulncheck checks the standard library of the Go it runs with.
          check-latest: true
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: go mod tidy -diff
      - run: go mod tidy -diff
        working-directory: tools
      - run: go tool -modfile=tools/go.mod golangci-lint run ./...
      - run: go tool -modfile=tools/go.mod govulncheck ./...
